<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>{{title}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:Arial, Helvetica, sans-serif; color:#333333;">

  <!-- Preheader (hidden preview text shown in inbox lists) -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{title}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border:1px solid #e5e7eb; border-radius:8px;">
          <tr>
            <td style="padding:36px 40px 24px;">
              <h1 style="margin:0 0 16px; font-size:22px; line-height:1.3; font-weight:600; color:#111827;">{{title}}</h1>
              <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#4b5563;">{{body}}</p>
              {{action}}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 40px; background-color:#f9fafb; border-top:1px solid #e5e7eb; font-size:12px; line-height:1.5; color:#9ca3af;">
              This is an automated message from <strong>Storage Gate</strong>. Please do not reply to this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
